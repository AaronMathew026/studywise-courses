<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4777ff"/>
      <stop offset="1" stop-color="#2346d4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1a5c" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  </g>
  <!-- back card -->
  <rect x="290" y="268" width="400" height="300" rx="56" fill="#ffffff" opacity="0.38" transform="rotate(-9 490 418)"/>
  <!-- front card -->
  <g filter="url(#shadow)">
    <rect x="300" y="392" width="424" height="318" rx="60" fill="#ffffff"/>
  </g>
  <path d="M416 552 L482 616 L612 484" fill="none" stroke="#2f5bea" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
